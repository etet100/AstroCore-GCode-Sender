name: Build G-Pilot

on:
  push:
    branches: [ master-v2 ]
  pull_request:
    branches: [ master-v2 ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Qt 6.8.1 (MinGW)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.1"
          host: "windows"
          target: "desktop"
          arch: "win64_mingw"
          tools: "tools_mingw1310"
          modules: "qtmultimedia qtserialport qtimageformats qtshadertools"
          cache: true

      - name: Verify Qt installation
        env:
          QMAKESPEC: win32-g++
        run: |
          qmake --version
          g++ --version || echo "g++ not found in PATH"
          qmake -query QMAKE_SPEC || echo "QMAKE_SPEC not found"

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup build
        shell: cmd
        run: |
          where gcc
          gcc --version
          where g++
          g++ --version
          mkdir build

      - name: Build PropertyEditor
        shell: cmd
        env:
          QMAKESPEC: win32-g++
          WINDOWS: "1"
        run: |
          mkdir build\vendor\PropertyEditor
          cd build\vendor\PropertyEditor
          qmake ../../../src/vendor/PropertyEditor/PropertyEditor.pro -spec win32-g++ "CONFIG+=debug" "CONFIG-=qml_debug" "CONFIG-=qtquickcompiler"
          mingw32-make.exe -f Makefile qmake_all
          mingw32-make -j12

      - name: Build uCNC
        shell: cmd
        env:
          QMAKESPEC: win32-g++
          WINDOWS: "1"
        run: |
          mkdir build\vendor\uCNC
          cd build\vendor\uCNC
          qmake ../../../src/vendor/uCNC/uCNC.pro -spec win32-g++ "CONFIG+=debug" "CONFIG-=qml_debug" "CONFIG-=qtquickcompiler" "QMAKE_CFLAGS+=-Wno-unused-parameter -Wno-unused-function -Wno-unused-variable -Wno-missing-field-initializers" "QMAKE_CXXFLAGS+=-Wno-unused-parameter -Wno-unused-function -Wno-unused-variable -Wno-missing-field-initializers"
          mingw32-make.exe -f Makefile qmake_all
          mingw32-make -j12

      - name: Build grblHal
        shell: cmd
        env:
          QMAKESPEC: win32-g++
          WINDOWS: "1"
        run: |
          mkdir build\vendor\grblHal
          cd build\vendor\grblHal
          qmake ../../../src/vendor/grblHal/grblHal.pro -spec win32-g++ "CONFIG+=debug" "CONFIG-=qml_debug" "CONFIG-=qtquickcompiler" "QMAKE_CFLAGS+=-Wno-unused-parameter -Wno-unused-function -Wno-unused-variable -Wno-missing-field-initializers" "QMAKE_CXXFLAGS+=-Wno-unused-parameter -Wno-unused-function -Wno-unused-variable -Wno-missing-field-initializers"
          mingw32-make.exe -f Makefile qmake_all
          mingw32-make -j12

      - name: Build designerplugins
        shell: cmd
        env:
          QMAKESPEC: win32-g++
          WINDOWS: "1"
        run: |
          mkdir build\designerplugins
          cd build\designerplugins
          qmake ../../src/designerplugins/designerplugins.pro -r
          mingw32-make -j12

      - name: Build G-Pilot
        shell: cmd
        env:
          QMAKESPEC: win32-g++
          WINDOWS: "1"
        run: |
          mkdir build\gpilot
          cd build\gpilot
          qmake ../../src/gpilot/gpilot.pro -spec win32-g++ "CONFIG+=debug" "DISABLE_BUILD_NUMBER_INCREMENT=1"
          mingw32-make.exe -f Makefile qmake_all
          mingw32-make -j12

      - name: Run windeployqt
        shell: cmd
        run: |
          windeployqt build\gpilot\gpilot.exe
          dir build\gpilot / s

      - name: Clean build artifacts (remove source files)
        shell: cmd
        run: |
          cd build\gpilot
          del /S /Q *.o
          del /S /Q *.cpp
          del /S /Q *.h
          del /Q Makefile*

      - name: Package build artifacts
        shell: cmd
        run: |
          ls build
          mkdir artifacts
          for /R build %%f in (*.dll) do copy /Y "%%f" artifacts\
          for /R build %%f in (*.exe) do copy /Y "%%f" artifacts\
          xcopy gpilot\* artifacts\ /E /I /H /Y
          powershell Compress-Archive -Path artifacts\* -DestinationPath gpilot.zip

      - name: Create GitHub pre-release with build artifacts
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: auto-build-${{ github.run_id }}
          name: "Automatic build ${{ github.run_id }}"
          prerelease: true
          body: |
            Automatic build created from commit ${{ github.sha }}.
            This build contains only DLL and EXE files. This is not a full version of the program!
            You can use these files by replacing them in the folder of a full release (downloaded from Releases).
          files: gpilot.zip
