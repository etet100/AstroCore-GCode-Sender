name: Build G-Pilot

on:
  push:
    branches: [ master-v2 ]
  pull_request:
    branches: [ master-v2 ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Remove broken WindowsApps python.exe from PATH
        shell: pwsh
        run: |
          Write-Host "Cleaning PATH..."
          $paths = $env:PATH -split ';' | Where-Object {$_ -notmatch 'WindowsApps'}
          $newPath = ($paths -join ';')
          Write-Host "New PATH set without WindowsApps"
          [Environment]::SetEnvironmentVariable('PATH', $newPath, 'Process')

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Qt 6.8.1 (MinGW)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.1"
          host: "windows"
          target: "desktop"
          arch: "win64_mingw"
          modules: "qtmultimedia qtserialport qtimageformats qtshadertools"
          cache: true

      - name: Verify Qt installation
        env:
          QMAKESPEC: win32-g++
        run: |
          qmake --version
          g++ --version || echo "g++ not found in PATH"
          qmake -query QMAKE_SPEC || echo "QMAKE_SPEC not found"

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build PropertyEditor
        env:
          QMAKESPEC: win32-g++
          WINDOWS: "1"
        run: |
          cd src/vendor/PropertyEditor
          qmake PropertyEditor.pro -spec win32-g++ "CONFIG+=debug" "CONFIG-=qml_debug" "CONFIG-=qtquickcompiler"
          mingw32-make.exe -f Makefile qmake_all
          mingw32-make -j12

      - name: Build uCNC
        env:
          QMAKESPEC: win32-g++
          WINDOWS: "1"
        run: |
          cd src/vendor/uCNC
          qmake uCNC.pro -spec win32-g++ "CONFIG+=debug" "CONFIG-=qml_debug" "CONFIG-=qtquickcompiler"
          mingw32-make.exe -f Makefile qmake_all
          mingw32-make -j12

      - name: Build grblHal
        env:
          QMAKESPEC: win32-g++
          WINDOWS: "1"
        run: |
          cd src/vendor/grblHal
          qmake grblHal.pro -spec win32-g++ "CONFIG+=debug" "CONFIG-=qml_debug" "CONFIG-=qtquickcompiler"
          mingw32-make.exe -f Makefile qmake_all
          mingw32-make -j12

      - name: Build G-Pilot
        env:
          QMAKESPEC: win32-g++
          WINDOWS: "1"
        run: |
            qmake gpilot.pro -spec win32-g++ "CONFIG+=debug" "CONFIG-=qml_debug" "CONFIG-=qtquickcompiler"
            mingw32-make.exe -f Makefile qmake_all
            mingw32-make -j12

