name: Build G-Pilot

on:
  push:
    branches: [ master-v2 ]
  pull_request:
    branches: [ master-v2 ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.1'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          tools: 'tools_mingw90'
          set-env: 'true'
          aqtversion: '==3.1.*'
          extra: '--archives qtbase qtserialport qtmultimedia qtmultimediawidgets qtnetwork qtopengl qtopenglwidgets qtsvg'

      - name: Build
        env:
          QMAKESPEC: win32-g++
          WINDOWS: "1"
          QT_DEBUG_PLUGINS: "1"
        run: |
          qmake --version
          mingw32-make --version
          dir %Qt6_DIR%
          dir %Qt6_DIR%\bin
          qmake gpilot.pro "CONFIG+=release" "DEFINES+=WINDOWS=1"
          mingw32-make -j4

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GPilot-bin
          path: bin/