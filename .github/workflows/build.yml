name: Build G-Pilot

on:
  push:
    branches: [ master-v2 ]
  pull_request:
    branches: [ master-v2 ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.1'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          tools: 'tools_mingw90'

      - name: Build
        run: |
          qmake gpilot.pro
          mingw32-make -j4

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: GPilot-bin
          path: bin/