name: Build AstroCore

on:
  push:
    branches: [ master-v2 ]
  pull_request:
    branches: [ master-v2 ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    # experimental jobs (macOS) may fail without breaking the whole workflow
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            config: debug
          - os: windows-latest
            config: release
          - os: ubuntu-latest
            config: debug
          - os: ubuntu-latest
            config: release
          - os: macos-latest
            config: debug
            experimental: true
          - os: macos-latest
            config: release
            experimental: true
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: List available Qt modules for Linux
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          # aqtinstall 3.3.0 (latest on PyPI) does not know the new per-arch
          # repo layout introduced with Qt 6.11; the fix is only on master.
          # Switch back to the PyPI release once 3.4.0 is out.
          python -m pip install git+https://github.com/miurahr/aqtinstall.git
          aqt list-qt linux desktop --arch 6.11.1
          aqt list-qt linux desktop --modules 6.11.1 linux_gcc_64

      - name: Install Qt 6.11.1
        uses: jurplel/install-qt-action@v4
        with:
          # see comment above — remove aqtsource once aqtinstall 3.4.0 is released
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git"
          version: "6.11.1"
          host: ${{ matrix.os == 'windows-latest' && 'windows' || matrix.os == 'macos-latest' && 'mac' || 'linux' }}
          target: "desktop"
          arch: ${{ matrix.os == 'windows-latest' && 'win64_mingw' || matrix.os == 'macos-latest' && 'clang_64' || 'linux_gcc_64' }}
          tools: ${{ matrix.os == 'windows-latest' && 'tools_mingw1310 tools_ifw' || '' }}
          modules: ${{ matrix.os == 'windows-latest' && 'qtmultimedia qtserialport qtimageformats qtshadertools' || 'qtmultimedia qtserialport qtimageformats qtshadertools' }}
          cache: true

      - name: Patch Qt for new Xcode toolchain
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          # Qt < 6.11.1 calls __yield(), which new Xcode toolchains no longer declare.
          # Same fix as the official Qt patch: use the clang builtin instead.
          # Remove this step after upgrading Qt to 6.11.1+.
          HEADER=$(find -L "$QT_ROOT_DIR" -name qyieldcpu.h -print -quit)
          if [ -n "$HEADER" ]; then
            sed -i '' 's/__yield();/__builtin_arm_yield();/' "$HEADER"
            grep -n "__builtin_arm_yield" "$HEADER"
          else
            echo "qyieldcpu.h not found - Qt layout changed?"
            exit 1
          fi

          # The AGL framework was removed from new macOS SDKs, but Qt qmake
          # files (mkspecs, module .pri, library .prl) still reference it.
          # Strip it from every file qmake can read link flags from.
          find -L "$QT_ROOT_DIR" \( -name '*.prl' -o -name '*.pri' -o -name '*.conf' \) -print0 \
            | xargs -0 grep -l -- '-framework AGL' \
            | while read -r f; do
                sed -i '' 's/-framework AGL//g' "$f"
                echo "patched: $f"
              done
          echo "Remaining AGL references (should be none):"
          find -L "$QT_ROOT_DIR" \( -name '*.prl' -o -name '*.pri' -o -name '*.conf' \) -print0 \
            | xargs -0 grep -l -- '-framework AGL' || echo "none"

      - name: Verify Qt installation
        shell: bash
        run: |
          qmake --version
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            g++ --version || echo "g++ not found in PATH"
          else
            g++ --version
          fi
          qmake -query QMAKE_SPEC || echo "QMAKE_SPEC not found"

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup build
        shell: bash
        run: |
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            where gcc
            gcc --version
            where g++
            g++ --version
            mkdir build
          else
            which gcc
            gcc --version
            which g++
            g++ --version
            mkdir -p build
          fi

      - name: Build PropertyEditor
        shell: bash
        env:
          QMAKESPEC: ${{ matrix.os == 'windows-latest' && 'win32-g++' || matrix.os == 'macos-latest' && 'macx-clang' || 'linux-g++' }}
          WINDOWS: ${{ matrix.os == 'windows-latest' && '1' || '' }}
        run: |
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            mkdir -p build/vendor/PropertyEditor
            cd build/vendor/PropertyEditor
            qmake ../../../src/vendor/PropertyEditor/PropertyEditor.pro -spec win32-g++ "${{ matrix.config == 'debug' && 'CONFIG+=debug' || 'CONFIG-=debug' }}" "CONFIG-=qml_debug" "CONFIG-=qtquickcompiler"
            mingw32-make.exe -f Makefile qmake_all
            mingw32-make -j12
          else
            mkdir -p build/vendor/PropertyEditor
            cd build/vendor/PropertyEditor
            qmake ../../../src/vendor/PropertyEditor/PropertyEditor.pro "${{ matrix.config == 'debug' && 'CONFIG+=debug' || 'CONFIG-=debug' }}" "CONFIG-=qml_debug" "CONFIG-=qtquickcompiler"
            make -f Makefile qmake_all
            make -j$(getconf _NPROCESSORS_ONLN)
          fi

      - name: Build uCNC
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          QMAKESPEC: ${{ matrix.os == 'windows-latest' && 'win32-g++' || matrix.os == 'macos-latest' && 'macx-clang' || 'linux-g++' }}
          WINDOWS: ${{ matrix.os == 'windows-latest' && '1' || '' }}
        run: |
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            mkdir -p build/vendor/uCNC
            cd build/vendor/uCNC
            qmake ../../../src/vendor/uCNC/uCNC.pro -spec win32-g++ "${{ matrix.config == 'debug' && 'CONFIG+=debug' || 'CONFIG-=debug' }}" "CONFIG-=qml_debug" "CONFIG-=qtquickcompiler" "QMAKE_CFLAGS+=-Wno-unused-parameter -Wno-unused-function -Wno-unused-variable -Wno-missing-field-initializers" "QMAKE_CXXFLAGS+=-Wno-unused-parameter -Wno-unused-function -Wno-unused-variable -Wno-missing-field-initializers"
            mingw32-make.exe -f Makefile qmake_all
            mingw32-make -j12
          else
            mkdir -p build/vendor/uCNC
            cd build/vendor/uCNC
            qmake ../../../src/vendor/uCNC/uCNC.pro "CONFIG+=debug" "CONFIG-=qml_debug" "CONFIG-=qtquickcompiler" "QMAKE_CFLAGS+=-Wno-unused-parameter -Wno-unused-function -Wno-unused-variable -Wno-missing-field-initializers" "QMAKE_CXXFLAGS+=-Wno-unused-parameter -Wno-unused-function -Wno-unused-variable -Wno-missing-field-initializers"
            make -f Makefile qmake_all
            make -j$(getconf _NPROCESSORS_ONLN)
          fi

      - name: Build grblHal
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          QMAKESPEC: ${{ matrix.os == 'windows-latest' && 'win32-g++' || matrix.os == 'macos-latest' && 'macx-clang' || 'linux-g++' }}
          WINDOWS: ${{ matrix.os == 'windows-latest' && '1' || '' }}
        run: |
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            mkdir -p build/vendor/grblHal
            cd build/vendor/grblHal
            qmake ../../../src/vendor/grblHal/grblHal.pro -spec win32-g++ "${{ matrix.config == 'debug' && 'CONFIG+=debug' || 'CONFIG-=debug' }}" "CONFIG-=qml_debug" "CONFIG-=qtquickcompiler" "QMAKE_CFLAGS+=-Wno-unused-parameter -Wno-unused-function -Wno-unused-variable -Wno-missing-field-initializers" "QMAKE_CXXFLAGS+=-Wno-unused-parameter -Wno-unused-function -Wno-unused-variable -Wno-missing-field-initializers"
            mingw32-make.exe -f Makefile qmake_all
            mingw32-make -j12
          else
            mkdir -p build/vendor/grblHal
            cd build/vendor/grblHal
            qmake ../../../src/vendor/grblHal/grblHal.pro "CONFIG+=debug" "CONFIG-=qml_debug" "CONFIG-=qtquickcompiler" "QMAKE_CFLAGS+=-Wno-unused-parameter -Wno-unused-function -Wno-unused-variable -Wno-missing-field-initializers" "QMAKE_CXXFLAGS+=-Wno-unused-parameter -Wno-unused-function -Wno-unused-variable -Wno-missing-field-initializers"
            make -f Makefile qmake_all
            make -j$(getconf _NPROCESSORS_ONLN)
          fi

      - name: Build FluidNC
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          QMAKESPEC: ${{ matrix.os == 'windows-latest' && 'win32-g++' || matrix.os == 'macos-latest' && 'macx-clang' || 'linux-g++' }}
          WINDOWS: ${{ matrix.os == 'windows-latest' && '1' || '' }}
        run: |
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            mkdir -p build/vendor/FluidNC
            cd build/vendor/FluidNC
            qmake ../../../src/vendor/FluidNC/FluidNC.pro -spec win32-g++ "${{ matrix.config == 'debug' && 'CONFIG+=debug' || 'CONFIG-=debug' }}" "CONFIG-=qml_debug" "CONFIG-=qtquickcompiler"
            mingw32-make.exe -f Makefile qmake_all
            mingw32-make -j12
          else
            mkdir -p build/vendor/FluidNC
            cd build/vendor/FluidNC
            qmake ../../../src/vendor/FluidNC/FluidNC.pro "CONFIG+=debug" "CONFIG-=qml_debug" "CONFIG-=qtquickcompiler"
            make -f Makefile qmake_all
            make -j$(getconf _NPROCESSORS_ONLN)
          fi

      - name: Build designerplugins
        shell: bash
        env:
          QMAKESPEC: ${{ matrix.os == 'windows-latest' && 'win32-g++' || matrix.os == 'macos-latest' && 'macx-clang' || 'linux-g++' }}
          WINDOWS: ${{ matrix.os == 'windows-latest' && '1' || '' }}
        run: |
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            mkdir -p build/designerplugins
            cd build/designerplugins
            qmake ../../src/designerplugins/designerplugins.pro -r
            mingw32-make -j12
          else
            mkdir -p build/designerplugins
            cd build/designerplugins
            qmake ../../src/designerplugins/designerplugins.pro -r
            make -j$(getconf _NPROCESSORS_ONLN)
          fi

      - name: Build qCoro
        shell: bash
        run: |
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            cd src/vendor/qcoro/
            cmake -B build -S . -G Ninja -DQCORO_WITH_QTWEBSOCKETS=OFF -DBUILD_TESTING=OFF -DQCORO_BUILD_EXAMPLES=OFF
            cmake --build build
            cmake --install build --prefix install
            cd ../../..
            mkdir -p build/vendor/qcoro
            cp -r src/vendor/qcoro/install build/vendor/qcoro/
          else
            cd src/vendor/qcoro/
            cmake -B build -S . -DQCORO_WITH_QTWEBSOCKETS=OFF -DBUILD_TESTING=OFF -DQCORO_BUILD_EXAMPLES=OFF
            cmake --build build -- -j$(getconf _NPROCESSORS_ONLN)
            cmake --install build --prefix install
            cd ../../..
            mkdir -p build/vendor/qcoro
            cp -r src/vendor/qcoro/install build/vendor/qcoro/
          fi

      - name: Build AstroCore
        shell: bash
        env:
          QMAKESPEC: ${{ matrix.os == 'windows-latest' && 'win32-g++' || matrix.os == 'macos-latest' && 'macx-clang' || 'linux-g++' }}
          WINDOWS: ${{ matrix.os == 'windows-latest' && '1' || '' }}
        run: |
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            mkdir -p build/gpilot
            cd build/gpilot
            qmake ../../src/gpilot/gpilot.pro -spec win32-g++ "${{ matrix.config == 'debug' && 'CONFIG+=debug' || 'CONFIG-=debug' }}" "DISABLE_BUILD_NUMBER_INCREMENT=1"
            mingw32-make.exe -f Makefile qmake_all
            mingw32-make -j12
          else
            mkdir -p build/gpilot
            cd build/gpilot
            qmake ../../src/gpilot/gpilot.pro "${{ matrix.config == 'debug' && 'CONFIG+=debug' || 'CONFIG-=debug' }}" "DISABLE_BUILD_NUMBER_INCREMENT=1"
            make -f Makefile qmake_all
            make -j$(getconf _NPROCESSORS_ONLN)
          fi

      - name: Create complete package
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          cd build\gpilot
          windeployqt AstroCore.exe
          for /R .. %%f in (*.dll) do copy /Y "%%f" .
          del /S /Q *.o
          del /S /Q *.cpp
          del /S /Q *.h
          del /S /Q *.hpp
          del /S /Q *.rc
          del /S /Q *.ui
          del /S /Q *.qrc
          del /S /Q *.pro
          del /S /Q *.pri
          del /Q Makefile*

      - name: Create offline installer
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          xcopy build\gpilot\* installer\packages\com.astrocore.app\data\ /E /I /H /Y
          xcopy data\fluidnc\* installer\packages\com.astrocore.app\data\ /E /I /H /Y
          xcopy data\gcode\* installer\packages\com.astrocore.examples.gcode\data\gcode-examples\ /E /I /H /Y
          binarycreator.exe --offline-only -c installer\config.xml -p installer\packages AstroCore-windows-x64-${{ matrix.config }}-setup.exe

      - name: Package build artifacts
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          ls build
          mkdir artifacts
          for /R build %%f in (*.dll) do copy /Y "%%f" build\gpilot\
          dir build\gpilot / s
          powershell Compress-Archive -Path build\gpilot\* -DestinationPath AstroCore-windows-x64-${{ matrix.config }}-portable.zip

      - name: Upload build artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: astrocore-windows-${{ matrix.config }}-artifacts
          path: |
            AstroCore-windows-x64-${{ matrix.config }}-portable.zip
            AstroCore-windows-x64-${{ matrix.config }}-setup.exe

      - name: Create AppImage
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0

          curl -fLO https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fLO https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

          # icon file name must match "Icon=astrocore" in the .desktop file
          cp src/gpilot/ui/images/astrocore_256.png astrocore.png

          # let linuxdeploy resolve libs built in this workflow (customwidgets, qcoro)
          export LD_LIBRARY_PATH="$PWD/build/gpilot:$PWD/build/vendor/qcoro/install/lib:$PWD/src/vendor/qcoro/install/lib:${LD_LIBRARY_PATH:-}"
          export QMAKE=$(which qmake)
          export APPIMAGE_EXTRACT_AND_RUN=1
          export EXTRA_QT_PLUGINS="multimedia"
          export LDAI_OUTPUT="AstroCore-linux-x86_64-${{ matrix.config }}.AppImage"

          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable build/gpilot/AstroCore \
            --desktop-file installer/linux/AstroCore.desktop \
            --icon-file astrocore.png \
            --plugin qt \
            --output appimage

      - name: Upload build artifacts (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: astrocore-linux-${{ matrix.config }}-artifacts
          path: AstroCore-linux-x86_64-${{ matrix.config }}.AppImage

      - name: Create DMG package
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          cd build/gpilot
          echo "== app dependencies before deploy =="
          otool -L AstroCore.app/Contents/MacOS/AstroCore

          # bundle libraries built in this workflow (macdeployqt only handles Qt)
          mkdir -p AstroCore.app/Contents/Frameworks
          for lib in libgpilot-customwidgets*.dylib ../vendor/qcoro/install/lib/libQCoro6Core*.dylib; do
            [ -e "$lib" ] && cp -a "$lib" AstroCore.app/Contents/Frameworks/
          done

          # repoint the app at the bundled copies, whatever path was recorded at link time
          for name in gpilot-customwidgets QCoro6Core; do
            REF=$(otool -L AstroCore.app/Contents/MacOS/AstroCore | awk -v n="$name" '$1 ~ n {print $1; exit}')
            if [ -n "$REF" ]; then
              BASE=$(basename "$REF")
              install_name_tool -change "$REF" "@executable_path/../Frameworks/$BASE" AstroCore.app/Contents/MacOS/AstroCore
              echo "repointed: $REF -> @executable_path/../Frameworks/$BASE"
            fi
          done

          # -executable makes macdeployqt fix Qt references inside bundled dylibs too
          EXTRA_ARGS=""
          for f in AstroCore.app/Contents/Frameworks/*.dylib; do
            [ -e "$f" ] && EXTRA_ARGS="$EXTRA_ARGS -executable=$f"
          done
          macdeployqt AstroCore.app -dmg $EXTRA_ARGS

          echo "== app dependencies after deploy =="
          otool -L AstroCore.app/Contents/MacOS/AstroCore

          mv AstroCore.dmg ../../AstroCore-macos-arm64-${{ matrix.config }}.dmg

      - name: Upload build artifacts (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: astrocore-macos-${{ matrix.config }}-artifacts
          path: AstroCore-macos-arm64-${{ matrix.config }}.dmg

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release with all artifacts
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: auto-build-${{ github.run_id }}
          name: "Automatic build ${{ github.run_id }}"
          prerelease: true
          body: |
            Automatic build created from commit ${{ github.sha }}.

            ## Available Builds

            Each platform comes in a **release** and a **debug** variant.

            **Windows (x64):**
            - AstroCore-windows-x64-release-portable.zip - portable version
            - AstroCore-windows-x64-release-setup.exe - offline installer

            **Linux (x86_64):**
            - AstroCore-linux-x86_64-release.AppImage - portable AppImage

            **macOS (Apple Silicon, experimental):**
            - AstroCore-macos-arm64-release.dmg - disk image

            macOS builds are not signed. To run: right-click the app and choose
            "Open", or remove the quarantine flag with
            `xattr -dr com.apple.quarantine AstroCore.app`.
          files: |
            artifacts/astrocore-windows-debug-artifacts/AstroCore-windows-x64-debug-portable.zip
            artifacts/astrocore-windows-debug-artifacts/AstroCore-windows-x64-debug-setup.exe
            artifacts/astrocore-windows-release-artifacts/AstroCore-windows-x64-release-portable.zip
            artifacts/astrocore-windows-release-artifacts/AstroCore-windows-x64-release-setup.exe
            artifacts/astrocore-linux-debug-artifacts/AstroCore-linux-x86_64-debug.AppImage
            artifacts/astrocore-linux-release-artifacts/AstroCore-linux-x86_64-release.AppImage
            artifacts/astrocore-macos-debug-artifacts/AstroCore-macos-arm64-debug.dmg
            artifacts/astrocore-macos-release-artifacts/AstroCore-macos-arm64-release.dmg
